services:
  - type: web
    name: campus-complaint-system
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/campus_complaints.sqlite3
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: campus-complaint-data
      mountPath: /var/data
      sizeGB: 1
