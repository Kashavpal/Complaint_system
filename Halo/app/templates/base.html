<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CampusFix{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><header class="top"><a class="brand" href="{{url_for('index')}}">CampusFix</a><nav>{% if session.get('user_id') %}<a href="{{url_for('dashboard')}}">Dashboard</a><a class="bell" href="{{url_for('notifications')}}">♧ Notifications</a><a href="{{url_for('logout')}}">Logout</a>{% else %}<a href="{{url_for('login')}}">Login</a>{% endif %}</nav></header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='js/confirm.js')}}" defer></script></body></html>
